services:
  pdf-test:
    build:
      context: .
      dockerfile: infra/pdf/Dockerfile
    ports:
      - "127.0.0.1:3002:3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
