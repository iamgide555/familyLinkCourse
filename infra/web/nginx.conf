server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Fingerprinted build files are cacheable; the shell page never is.
  location ~* \.(?:js|css|woff2)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-store"; try_files $uri /index.html; }
}
